# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Single Service (API + React) to Azure Web App - oppora

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build React Frontend
        run: |
          cd Frontend
          npm ci
          npm run build
        env:
          VITE_API_BASE_URL: ""

      - name: Copy Frontend Build to .NET wwwroot
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "Backend/Oppora.API/wwwroot"
          Copy-Item -Path "Frontend/dist/*" -Destination "Backend/Oppora.API/wwwroot" -Recurse -Force

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Build with dotnet
        run: dotnet build Backend/Oppora.API/Oppora.API.csproj --configuration Release

      - name: dotnet publish
        run: dotnet publish Backend/Oppora.API/Oppora.API.csproj -c Release -o "${{env.DOTNET_ROOT}}/myapp"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: windows-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_71E55DF2D8BF45A99D5B6C26C29B8960 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_CCC6FB2E29C048B88FAD9251E16FCDDC }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_538A98AE0B494267BBF8AD593676FFC9 }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'oppora'
          slot-name: 'Production'
          package: .