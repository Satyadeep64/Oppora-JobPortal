name: Build and deploy Single Service (API + React) to Azure Web App - oppora

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Frontend Dependencies
        working-directory: ./Frontend
        run: npm install --include=dev
        env:
          NODE_ENV: development

      - name: Build React Frontend
        working-directory: ./Frontend
        run: npm run build
        env:
          VITE_API_BASE_URL: ""

      - name: Copy Frontend Build to .NET wwwroot
        run: |
          mkdir -p Backend/Oppora.API/wwwroot
          cp -R Frontend/dist/. Backend/Oppora.API/wwwroot/

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish Single Service Bundle
        run: dotnet publish Backend/Oppora.API/Oppora.API.csproj -c Release -o ./publish

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: net-app
          path: ./publish

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: net-app

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'oppora'
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./