name: Build and Deploy Single Service (API + React) to Azure App Service

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build React Frontend
        run: |
          cd Frontend
          npm ci || npm install
          npm run build
        env:
          VITE_API_BASE_URL: ""

      - name: Copy Frontend Build to .NET wwwroot
        run: |
          mkdir -p Backend/Oppora.API/wwwroot
          cp -r Frontend/dist/* Backend/Oppora.API/wwwroot/

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore .NET Dependencies
        run: dotnet restore Backend/Oppora.API/Oppora.API.csproj

      - name: Build .NET API
        run: dotnet build Backend/Oppora.API/Oppora.API.csproj --configuration Release --no-restore

      - name: Publish Single Service Bundle
        run: dotnet publish Backend/Oppora.API/Oppora.API.csproj -c Release -o ./publish --no-build

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish
